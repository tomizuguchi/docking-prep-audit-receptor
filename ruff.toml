# The linter configuration for this deposit.
#
# Every rule in the ignore list below was looked at and left as it stands. The
# reason is written against each one. With the ignore list removed, the select
# list below reports 175 findings over the 14 scripts in scripts_receptor/;
# saying only that the code "does not pass a linter" would not be accurate.
# The counts are as of 2026-11-09.
#
#   ruff check .                nothing is reported under this configuration
#   ruff check . --statistics   the breakdown
#
# The fixes ruff could apply automatically have been applied. After applying
# them, PDB2PQR and Meeko were each re-run on 6 structures and the output was
# md5-identical, make_inputs.py was rebuilt over all 300 files and was
# byte-identical, measure_field.py --selftest passed, and the deposited
# measurement tables were regenerated from the deposited scripts and compared.

line-length = 120
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "S", "BLE", "EXE", "ISC", "PL", "RUF"]

ignore = [
  # --- deliberate design ---

  "SIM115",   # open-file-with-context-handler (20)
              # Most are of the form list(csv.DictReader(open(p))), which reads and closes at once.
              # The writes rely on CPython's reference counting to flush. Rewriting scripts that
              # produced deposited data, for the sake of style, costs more than it gains. Fix these
              # before running under an implementation other than CPython 3.

  "BLE001",   # blind-except (8)
              # Deliberate: it stops one structure's failure from taking down the whole run.
              # The reason is written in a comment at each site.

  "PLW1510",  # subprocess-run-without-check (2)
              # Deliberate: mk_prepare_receptor can return rc=0 on failure, so the decision is made
              # from the content of the output rather than from returncode.

  "S603",     # subprocess-without-shell-equals-true (2)
              # These calls invoke the tools under measurement. Calling them by their name on PATH is
              # part of what is being measured, so they are not changed to absolute paths.

  "S310",     # suspicious-url-open-usage (3) Fetching from RCSB. The URLs are fixed.

  "S311",     # pseudo-random-generators (1) fetch_strata.py:183, drawing the sample.
              # Not a cryptographic use. The draw is seeded, and the seed is recorded in the
              # seed column of data_receptor/full100_manifest.csv.

  "S110",     # try-except-pass (1) profile_pdb.py:74.
              # Skipping an unparsable line without counting it is what this tally is specified to do.

  "S101",     # assert (5) Used for cross-checks. These may be removed by -O.

  "PLC0415",  # import-outside-top-level (1) check_receptor.py:648.
              # A heavy import read only inside the branch that uses it. Deliberate.

  "E741",     # ambiguous-variable-name (18) A line is named l.
              # Many loops read PDB lines, and another name makes them harder to read.

  # --- false positive ---

  "B023",     # function-uses-loop-variable (3) compare_tools.py:144.
              # interm is called on line 146, inside the same iteration that defines it. There is no
              # site that stores the function and calls it later; this was checked.

  # --- forms that were looked at and kept ---
  # All of these are in scripts that produced deposited data, so they are not rewritten for style.

  "F841",     # unused-variable (1) labels in compare_arms.py:43, which records the argument order.
  "C416",     # unnecessary comprehension (1) compare_arms.py:37.
  "B007",     # unused-loop-control-variable (1) classify_titr.py:165.
  "RUF007",   # prefer itertools.pairwise (1) profile_pdb.py:113.
  "B905",     # zip-without-explicit-strict (1) the same line.
              # zip(nums, nums[1:]) relies on the lengths differing, so strict is not set.
  "SIM105",   # suppressible-exception (3) use contextlib.suppress.
  "RUF005",   # collection-literal-concatenation (4) the a + [x] form.
  "C408",     # unnecessary-collection-call (4) the dict(a=1) form.
  "C405",     # unnecessary-literal-set (2)
  "PLR1714",  # repeated-equality-comparison (2)
  "ISC004",   # implicit-string-concatenation-in-collection-literal (4)
  "PLR0911",  # too many return statements (1) the decision branches in check_receptor.py:641.

  # --- excluded because of what this deposit is ---

  "PLR2004",  # magic-value-comparison (69)
              # Column positions in PDB records, element radii and the like. Naming them as
              # constants would make them harder to read against the format they come from.
  "PLR0912", "PLR0913", "PLR0915",  # counts of branches, arguments and statements. These are
                                    # measurement scripts, so the counts are high.
  "C901",     # cyclomatic complexity. As above.
  "D",        # docstring conventions. Not followed.
  "ANN",      # type annotations. Not used.
  "T201",     # print. The scripts are built to report progress on standard output.
  "ERA001",   # commented-out code. Some sites keep the commands for re-running a step.
  "INP001",   # no __init__.py. These are standalone scripts, not a package.
  "PTH",      # use pathlib. Written with os.path.
  "EM", "TRY003",  # move exception messages into variables.
  "COM812",   # trailing commas.
  "Q000",     # quote style.
]
